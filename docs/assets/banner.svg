<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>

  <!-- Reticle accent, left -->
  <circle cx="96" cy="140" r="58" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.35"/>
  <g stroke="url(#amber)" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="96" y1="66" x2="96" y2="78"/>
    <line x1="96" y1="202" x2="96" y2="214"/>
    <line x1="22" y1="140" x2="34" y2="140"/>
    <line x1="158" y1="140" x2="170" y2="140"/>
  </g>

  <!-- Emblem: database cylinder (Postgres bridge, the project's core technical identity) -->
  <g transform="translate(96,138)">
    <path d="M-30,-28 C-30,-36 30,-36 30,-28 L30,22 C30,30 -30,30 -30,22 Z" fill="none" stroke="url(#amber)" stroke-width="4"/>
    <path d="M-30,-28 C-30,-20 30,-20 30,-28" fill="none" stroke="url(#amber)" stroke-width="4"/>
    <path d="M-30,-3 C-30,5 30,5 30,-3" fill="none" stroke="url(#amber)" stroke-width="3.5" opacity="0.75"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="122" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800"
        letter-spacing="3" fill="#f1f5f9">TASDYN-ALIFE</text>
  <text x="202" y="160" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400"
        letter-spacing="1" fill="#94a3b8">Arma 3 Roleplay &#8212; PostgreSQL-Backed, Vanilla Client</text>

  <!-- Divider -->
  <rect x="202" y="178" width="640" height="2" fill="#334155"/>

  <text x="202" y="206" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="1" fill="#64748b">
    Client requests. Server decides.
  </text>

  <!-- Studio mark -->
  <text x="1180" y="256" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-weight="700"
        font-size="15" letter-spacing="3" fill="#f59e0b">TASMAN DYNAMICS</text>
</svg>
