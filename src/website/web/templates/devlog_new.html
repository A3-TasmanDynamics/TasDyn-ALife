{{define "content"}}
<div class="admin-shell">
  {{template "admin_sidebar" .}}
  <div id="admin-main" tabindex="-1" class="admin-content">
    {{template "admin_header" .}}
    <h1 class="page-title admin-title">New Devlog Post</h1>

    <section class="card">
      <form method="post" action="/admin/devlog/new">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div class="field">
          <label for="f-title">Title</label>
          <input id="f-title" type="text" name="title" maxlength="200" required autofocus />
        </div>
        <div class="field">
          <label for="f-body">Body</label>
          <textarea id="f-body" name="body" rows="14" required placeholder="Plain text only -- no markdown or HTML. Blank lines become paragraph breaks."></textarea>
        </div>
        <p class="hint">Posts publish immediately and appear on /devlog right away -- there's no draft/edit step yet.</p>
        <button class="cta" type="submit">Publish Post</button>
      </form>
    </section>
  </div>
</div>
{{end}}
