{{define "content"}}
<h1 class="page-title">My Tickets</h1>

<section class="card">
  <h2>Open a new ticket</h2>
  <form method="post" action="/tickets">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="field">
      <label>Subject</label>
      <input type="text" name="subject" maxlength="200" required />
    </div>
    <div class="field-grid">
      <div class="field">
        <label>Category</label>
        <select name="category">
          <option value="report">Player Report</option>
          <option value="bug">Bug</option>
          <option value="billing">Billing</option>
          <option value="appeal">Ban Appeal</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label>How urgent is this?</label>
        <select name="priority">
          <option value="low">Low -- no rush</option>
          <option value="normal" selected>Normal</option>
          <option value="high">High -- blocking me</option>
          <option value="urgent">Urgent -- need help now</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Details</label>
      <textarea name="body" rows="5" required></textarea>
    </div>
    <button class="cta" type="submit">Submit Ticket</button>
  </form>
</section>

<section class="card">
  <h2>Your tickets</h2>
  {{if .Tickets}}
    <table>
      <thead><tr><th>Priority</th><th>Subject</th><th>Category</th><th>Status</th><th></th></tr></thead>
      <tbody>
        {{range .Tickets}}
        <tr>
          <td><span class="badge badge-priority-{{.Priority}}">{{.Priority}}</span></td>
          <td>{{.Subject}}</td>
          <td>{{.Category}}</td>
          <td><span class="badge badge-status-{{.Status}}">{{.Status}}</span></td>
          <td><a href="/tickets/{{.ID}}">View</a></td>
        </tr>
        {{end}}
      </tbody>
    </table>
  {{else}}
    <p class="empty-state">No tickets yet.</p>
  {{end}}
</section>
{{end}}
