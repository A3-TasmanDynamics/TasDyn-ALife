{{define "content"}}
<div class="cmd-shell">
  {{template "command_sidebar" .}}
  <div class="cmd-main">
    <form method="post" action="/command/{{.Faction}}/drive/{{if .ID}}doc/{{.ID}}{{else}}docs{{end}}" class="gd-form" data-editor-form>
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <input type="hidden" name="body" data-editor-body>

      <header class="gd-head">
        <a class="gd-back" href="/command/{{.Faction}}/drive{{if .ID}}/doc/{{.ID}}{{else if .Item.FolderID}}?folder={{.Item.FolderID}}{{end}}" title="{{if .ID}}Back to the document{{else}}Back to the drive{{end}}" aria-label="{{if .ID}}Back to the document{{else}}Back to the drive{{end}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
        <span class="gd-docicon doc-cat-{{.Item.Category}}" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></span>
        <div class="gd-titles">
          <label class="visually-hidden" for="ed-title">Title</label>
          <input id="ed-title" class="gd-title" name="title" value="{{.Item.Title}}" maxlength="120" required placeholder="Untitled document">
          <div class="gd-props">
            <label><span>Type</span><select name="category">{{range .Categories}}<option value="{{.Key}}" {{if eq .Key $.Item.Category}}selected{{end}}>{{.Label}}</option>{{end}}</select></label>
            <label><span>Division</span><select name="division">{{if .Viewer.CanCreateAnywhere}}<option value="">Whole faction</option>{{end}}{{range .Divisions}}{{if $.Viewer.CanEdit .Key}}<option value="{{.Key}}" {{if eq .Key $.Item.Division}}selected{{end}}>{{.Name}}</option>{{end}}{{end}}</select></label>
            <label><span>Shown to</span><select name="visibility"><option value="members" {{if eq .Item.Visibility "members"}}selected{{end}}>Members</option><option value="command" {{if eq .Item.Visibility "command"}}selected{{end}}>Command panel only</option></select></label>
            <label><span>Folder</span><select name="folder"><option value="0">Drive (top level)</option>{{range .Folders}}<option value="{{.ID}}" {{if eq .ID $.Item.FolderID}}selected{{end}}>{{.Name}}</option>{{end}}</select></label>
          </div>
        </div>
        <div class="gd-head-actions">
          <span class="gd-status" data-editor-status>{{if .ID}}All changes saved{{else}}Not saved yet{{end}}</span>
          <button class="btn btn-primary" type="submit">{{if .ID}}Save{{else}}Create document{{end}}</button>
        </div>
      </header>

      <div class="gd" data-doc-editor>
        <div class="gd-toolbar" data-doc-toolbar></div>
        <div class="gd-body">
          <aside class="gd-outline" data-doc-outline aria-label="Document outline">
            <h2>Outline</h2>
            <div data-outline-list></div>
          </aside>
          <div class="gd-canvas">
            <div class="doc-page gd-page" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Document text" data-doc-page>{{.Body}}</div>
          </div>
        </div>
        <div class="gd-foot"><span data-doc-words></span><span>Each save keeps the previous version &middot; Ctrl+S to save</span></div>
      </div>
      <noscript><p class="banner banner-error">The editor needs JavaScript.</p></noscript>
    </form>
  </div>
</div>
<script src="/static/editor.js" defer></script>
{{end}}
